# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 — packaging + GitHub Release only.
# CLI is built by GoReleaser (pure Go, cross-compiles easily).
# GUI is prebuilt by ./build.sh (Docker) because it needs CGO + Wails.
# macOS is omitted: Wails GUI cannot be cross-built from Linux without extra setup.
#
#   ./scripts/release.sh v2.1.0
version: 2

project_name: gofle

# Build CLI with GoReleaser (pure Go, cross-compiles easily)
builds:
  - id: gofle-cli
    binary: gofle_cli
    main: ./cmd/gofle
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X GoFLE/pkg/version.Version={{.Version}}
      - -X GoFLE/pkg/version.BuildTime={{.Date}}
      - -X GoFLE/pkg/version.BuildCommit={{.Commit}}
      - -X GoFLE/pkg/version.BuildSource=release

archives:
  - id: gofle-cli-archive
    builds:
      - gofle-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE.md
      - README.md
      - CHANGELOG.md

release:
  github:
    owner: sankam-nikolya
    name: GoFLE
  name_template: "v{{ .Version }}"
  # Include prebuilt GUI binaries as separate release assets (not in archives)
  extra_files:
    - glob: ".goreleaser/staging/gofle-*"
  footer: |
    ---
    CLI built by GoReleaser; GUI built by `./build.sh` (Docker).
    Packaged by [GoReleaser](https://goreleaser.com).

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

snapshot:
  version_template: "{{ .Version }}-next"
