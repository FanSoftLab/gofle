<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- VS Code Base -->
  <rect width="512" height="512" rx="112" fill="#181825"/>

  <!-- Stack of Log Rows -->
  <!-- Top Row: INFO -->
  <rect x="112" y="128" width="80" height="32" rx="16" fill="#89B4FA"/>
  <rect x="216" y="128" width="184" height="32" rx="16" fill="#313244"/>

  <!-- Middle Row: ERROR (Large/Wide) -->
  <rect x="112" y="200" width="100" height="32" rx="16" fill="#F38BA8"/>
  <rect x="236" y="200" width="164" height="32" rx="16" fill="#585B70"/>

  <!-- Middle Row 2: WARN -->
  <rect x="112" y="272" width="90" height="32" rx="16" fill="#F9E2AF"/>
  <rect x="226" y="272" width="120" height="32" rx="16" fill="#313244"/>

  <!-- Bottom Row: TRACE -->
  <rect x="112" y="344" width="70" height="32" rx="16" fill="#94E2D5"/>
  <rect x="206" y="344" width="194" height="32" rx="16" fill="#313244"/>

  <!-- Overlay Minimal Lens (Circle Cutout) -->
  <circle cx="336" cy="312" r="88" fill="none" stroke="#007ACC" stroke-width="28"/>
  <path d="M 400 376 L 448 424" stroke="#007ACC" stroke-width="28" stroke-linecap="round"/>
</svg>
