site_name: GoFLE Documentation
site_description: Go Fast Log Explorer — cross-platform desktop log viewer for large files
site_url: https://gofle.dev
site_author: GoFLE Contributors
repo_url: https://github.com/sankam-nikolya/GoFLE
repo_name: sankam-nikolya/GoFLE
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 GoFLE Contributors. Licensed under MIT.

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang: [en, uk]
  - i18n:
      languages:
        - locale: en
          name: English
          build: true
          default: true
          nav_translations:
            Overview: Overview
            Getting Started: Getting Started
            User Guide: User Guide
            Configuration: Configuration
            CLI Reference: CLI Reference
            Troubleshooting: Troubleshooting
            API Reference: API Reference
            Release: Release
            Contributing: Contributing
        - locale: uk
          name: Українська
          build: true
          nav_translations:
            Overview: Огляд
            Getting Started: Початок роботи
            User Guide: Користувацький посібник
            Configuration: Налаштування
            CLI Reference: Довідка CLI
            Troubleshooting: Вирішення проблем
            API Reference: Довідка API
            Release: Релізи
            Contributing: Внесок

nav:
  - Overview: index.md
  - Getting Started:
      - Prerequisites: getting-started/prerequisites.md
      - Docker Build: getting-started/install-docker.md
      - Local Build: getting-started/install-local.md
      - Linux Install: getting-started/install-linux.md
      - First Run: getting-started/first-run.md
  - User Guide:
      - Open Files: user-guide/open-files.md
      - Open Remote (SSH): user-guide/open-remote-ssh.md
      - Open Remote (FTP/FTPS): user-guide/open-remote-ftp.md
      - Search Basics: user-guide/search-basics.md
      - Advanced Search: user-guide/search-advanced.md
      - Search Presets: user-guide/search-presets.md
      - Follow (Live Tail): user-guide/follow-tail.md
      - Tabs and Groups: user-guide/tabs-groups.md
      - Export Results: user-guide/export-results.md
      - Session Restore: user-guide/session-restore.md
      - Go to Line: user-guide/goto-line.md
      - Keyboard Shortcuts: user-guide/keyboard-shortcuts.md
  - Configuration:
      - Settings UI: configuration/settings-ui.md
      - Config Files: configuration/config-files.md
      - Settings Reference: configuration/settings-reference.md
  - CLI Reference:
      - Overview: cli-reference/cli-overview.md
      - Commands: cli-reference/cli-commands.md
      - Viewer Keys: cli-reference/cli-viewer-keys.md
      - Examples: cli-reference/cli-examples.md
  - Troubleshooting:
      - Index: troubleshooting/index.md
      - SSH Connection: troubleshooting/ssh-connection.md
      - FTP Connection: troubleshooting/ftp-connection.md
      - Performance: troubleshooting/performance.md
      - Search Issues: troubleshooting/search-issues.md
      - UI Issues: troubleshooting/ui-issues.md
      - Data Recovery: troubleshooting/data-recovery.md
  - API Reference:
      - Wails Bridge: api-reference/wails-bridge.md
      - Go Packages: api-reference/go-packages.md
      - Frontend Modules: api-reference/frontend-modules.md
  - Release:
      - Changelog: release/changelog.md
      - Release Process: release/release-process.md
      - Migration Guides: release/migration-guides.md
  - Contributing:
      - Dev Setup: contributing/dev-setup.md
      - Coding Conventions: contributing/coding-conventions.md
      - Testing: contributing/testing.md
      - PR Workflow: contributing/pr-workflow.md
      - Releasing: contributing/releasing.md

extra:
  glossary: glossary.md
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __code
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde