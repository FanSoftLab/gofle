StylesPath = .vale/styles
MinAlertLevel = suggestion

[formats]
md = markdown

[*.md]
BasedOnStyles = Vale

# Custom vocabulary
# Add technical terms to ignore
# Note: This requires Vale packages for full vocabulary support

# Rule configuration
SentenceLength = error
SentenceLength.max = 25

PassiveVoice = warning

Nominalization = warning

NounCluster = warning
NounCluster.max = 3

FillerWords = warning

Imperative = suggestion

ConsistentSpelling = error